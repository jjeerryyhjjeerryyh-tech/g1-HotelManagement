<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Book.css">
    <style>
        body { background: #f5f0e8; padding: 20px; }
        .page-wrap { max-width: 700px; margin: 0 auto; }
        .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        .back-btn { color: var(--primary, #c8873a); text-decoration: none; font-size: 14px; }
        h1 { font-size: 24px; font-weight: 700; }
        .msg-form { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
        .msg-form textarea { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 14px; resize: vertical; min-height: 80px; outline: none; }
        .msg-form textarea:focus { border-color: #c8873a; }
        .submit-btn { margin-top: 12px; background: #c8873a; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .submit-btn:hover { background: #b07030; }
        .msg-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 12px; }
        .msg-meta { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        .msg-content { font-size: 15px; color: #333; }
        .msg-reply { margin-top: 12px; background: #f0f7ff; border-left: 3px solid #c8873a; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; color: #555; }
        .msg-reply .reply-label { font-size: 12px; color: #c8873a; font-weight: 600; margin-bottom: 4px; }
        .empty { text-align: center; padding: 40px; color: #aaa; }
        .login-tip { text-align: center; padding: 20px; background: white; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="page-header">
            <a href="Book.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回</a>
            <h1>留言板</h1>
        </div>

        <div id="formArea"></div>
        <div id="msgList"></div>
    </div>

    <script>
        const API = 'http://43.132.210.15:3000';
        const username = sessionStorage.getItem('username');

        // 留言表单
        const formArea = document.getElementById('formArea');
        if (username) {
            formArea.innerHTML = `
                <div class="msg-form">
                    <h3 style="font-size:16px;font-weight:600;margin-bottom:12px;">发表留言</h3>
                    <textarea id="msgInput" placeholder="请输入您的留言或问题..."></textarea>
                    <button class="submit-btn" onclick="submitMsg()"><i class="fas fa-paper-plane"></i> 发送</button>
                </div>`;
        } else {
            formArea.innerHTML = `<div class="login-tip">请先 <a href="../login/login.html" style="color:#c8873a;">登录</a> 后发表留言</div>`;
        }

        async function submitMsg() {
            const content = document.getElementById('msgInput').value.trim();
            if (!content) { alert('请输入留言内容'); return; }
            await fetch(`${API}/api/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, content })
            });
            document.getElementById('msgInput').value = '';
            loadMessages();
        }

        async function loadMessages() {
            const res = await fetch(`${API}/api/messages`);
            const data = await res.json();
            const list = document.getElementById('msgList');
            const msgs = (data.messages || []).slice().reverse();
            if (!msgs.length) {
                list.innerHTML = `<div class="empty"><i class="fas fa-comments" style="font-size:36px;margin-bottom:12px;display:block;"></i>暂无留言</div>`;
                return;
            }
            list.innerHTML = msgs.map(m => `
                <div class="msg-card">
                    <div class="msg-meta">👤 ${m.username} · ${new Date(m.createdAt).toLocaleString('zh-CN')}</div>
                    <div class="msg-content">${m.content}</div>
                    ${m.reply ? `
                        <div class="msg-reply">
                            <div class="reply-label">🏨 管理员回复</div>
                            <div>${m.reply}</div>
                            <div style="font-size:11px;color:#aaa;margin-top:4px;">${new Date(m.repliedAt).toLocaleString('zh-CN')}</div>
                        </div>` : ''}
                </div>
            `).join('');
        }

        loadMessages();
    </script>
</body>
</html>
