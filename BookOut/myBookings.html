<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的预订</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Book.css">
    <style>
        body { background: #f5f0e8; padding: 20px; }
        .page-header { max-width: 900px; margin: 0 auto 24px; display: flex; align-items: center; gap: 16px; }
        .back-btn { color: var(--primary, #c8873a); text-decoration: none; font-size: 14px; }
        .back-btn:hover { text-decoration: underline; }
        h1 { font-size: 24px; font-weight: 700; }
        .bookings-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .booking-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .booking-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .booking-id { font-size: 13px; color: #888; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-confirmed { background: #e6f7ee; color: #00a854; }
        .status-cancelled { background: #fff1f0; color: #f5222d; }
        .booking-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .info-item label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
        .info-item span { font-size: 15px; font-weight: 600; color: #333; }
        .empty { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty i { font-size: 48px; margin-bottom: 16px; display: block; }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="Book.html" class="back-btn"><i class="fas fa-arrow-left"></i> 返回</a>
        <h1>我的预订</h1>
    </div>
    <div class="bookings-list" id="bookingsList"></div>

    <script>
        const API = 'http://localhost:3000';
        const username = sessionStorage.getItem('username');

        if (!username) {
            document.getElementById('bookingsList').innerHTML = `
                <div class="empty">
                    <i class="fas fa-user-lock"></i>
                    <p>请先登录后查看预订记录</p>
                    <a href="../login/login.html" style="color:#c8873a;">前往登录</a>
                </div>`;
        } else {
            fetch(`${API}/api/bookings`)
                .then(r => r.json())
                .then(data => {
                    const myList = (data.bookings || []).filter(b => b.username === username);
                    const container = document.getElementById('bookingsList');
                    if (!myList.length) {
                        container.innerHTML = `<div class="empty"><i class="fas fa-calendar-times"></i><p>暂无预订记录</p></div>`;
                        return;
                    }
                    container.innerHTML = myList.reverse().map(b => `
                        <div class="booking-card">
                            <div class="booking-card-header">
                                <span class="booking-id">订单号：${b.id}</span>
                                <span class="status-badge status-${b.status}">${b.status === 'confirmed' ? '已确认' : b.status === 'cancelled' ? '已取消' : b.status}</span>
                            </div>
                            <div class="booking-info">
                                <div class="info-item"><label>房型</label><span>${b.roomType || '-'}</span></div>
                                <div class="info-item"><label>入住日期</label><span>${b.checkIn}</span></div>
                                <div class="info-item"><label>退房日期</label><span>${b.checkOut}</span></div>
                                <div class="info-item"><label>入住人数</label><span>${b.guests} 人</span></div>
                                <div class="info-item"><label>总金额</label><span>¥${b.totalAmount}</span></div>
                                <div class="info-item"><label>预订时间</label><span>${new Date(b.createdAt).toLocaleDateString('zh-CN')}</span></div>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('bookingsList').innerHTML = `<div class="empty"><i class="fas fa-exclamation-circle"></i><p>无法连接服务器</p></div>`;
                });
        }
    </script>
</body>
</html>
