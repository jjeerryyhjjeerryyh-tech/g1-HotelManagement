<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Book.css">
    <style>
        body { background: #f5f0e8; padding: 20px; }
        .page-header { max-width: 900px; margin: 0 auto 24px; display: flex; align-items: center; gap: 16px; }
        .back-btn { color: var(--primary, #c8873a); text-decoration: none; font-size: 14px; }
        .back-btn:hover { text-decoration: underline; }
        h1 { font-size: 24px; font-weight: 700; }
        .bookings-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
        .booking-card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .booking-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .booking-id { font-size: 13px; color: #888; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .status-confirmed  { background: #e6f7ee; color: #00a854; }
        .status-cancelled  { background: #fff1f0; color: #f5222d; }
        .status-checked-in { background: #e6f0ff; color: #165dff; }
        .status-checked-out{ background: #f0f0f0; color: #555; }
        .status-pending    { background: #fff7e6; color: #fa8c16; }
        .booking-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .info-item label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
        .info-item span { font-size: 15px; font-weight: 600; color: #333; }
        .empty { text-align: center; padding: 60px 20px; color: #aaa; }
        .empty i { font-size: 48px; margin-bottom: 16px; display: block; }

        /* 评价区域 */
        .review-section { margin-top: 20px; border-top: 1px solid #f0f0f0; padding-top: 16px; }
        .review-section h4 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #333; }
        .existing-review { background: #fafafa; border-radius: 8px; padding: 12px; font-size: 14px; }
        .existing-review .stars { color: #f59e0b; margin-bottom: 4px; }
        .existing-review .comment { color: #555; }
        .review-form { display: flex; flex-direction: column; gap: 10px; }
        .star-picker { display: flex; gap: 6px; }
        .star-picker i { font-size: 1.6rem; color: #f59e0b; cursor: pointer; transition: transform 0.1s; }
        .star-picker i:hover { transform: scale(1.2); }
        .review-form textarea {
            border: 1px solid #d1d5db; border-radius: 8px; padding: 10px;
            font-size: 14px; resize: none; font-family: inherit;
        }
        .review-form textarea:focus { outline: none; border-color: #f27405; }
        .submit-review-btn {
            align-self: flex-start; background: #f27405; color: white;
            border: none; padding: 8px 20px; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 500;
        }
        .submit-review-btn:hover { background: #d66304; }
        .review-hint { font-size: 13px; color: #9ca3af; padding: 8px 0; }

        /* 取消预订按钮 */
        .cancel-btn {
            background: none;
            border: 1px solid #f5222d;
            color: #f5222d;
            padding: 7px 18px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }
        .cancel-btn:hover { background: #fff1f0; }

        /* 语言切换器 */
        .lang-select {
            margin-left: auto;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            background: #f27405; /* 使用更鲜艳的橙色背景 */
            color: white;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(242, 116, 5, 0.3);
            appearance: none; /* 去掉原生下拉箭头 */
            -webkit-appearance: none;
            text-align: center;
        }
        .lang-select:hover {
            background: #d66304;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(242, 116, 5, 0.4);
        }
        .lang-select:focus { 
            box-shadow: 0 0 0 3px rgba(242, 116, 5, 0.2);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .page-header { flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 15px; }
            h1 { font-size: 18px; }
            .back-btn span { display: none; }
            .lang-select { margin-left: 0; width: auto; padding: 5px 10px; font-size: 12px; }
            .booking-card { padding: 15px; border-radius: 10px; }
            .booking-info { grid-template-columns: 1fr; gap: 10px; }
            .info-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f9f9f9; padding-bottom: 5px; }
            .info-item label { margin-bottom: 0; }
            .booking-card-header { flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
            .booking-id { font-size: 11px; }
            .status-badge { padding: 2px 8px; font-size: 11px; }
            .review-form textarea { font-size: 14px; }
            .star-picker i { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <a href="Book.html" class="back-btn"><i class="fas fa-arrow-left"></i> <span data-i18n="back_to_home">返回</span></a>
        <h1 data-i18n="my_bookings_title">我的订单</h1>
        <select id="langSelect" class="lang-select">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ja">日本語</option>
        </select>
    </div>
    <div class="bookings-list" id="bookingsList"></div>

    <script>
        const API      = 'http://43.132.210.15:3000';
        const username = sessionStorage.getItem('username');

        const i18n = {
            zh: {
                back_to_home: '返回',
                my_bookings_title: '我的订单',
                login_required: '请先登录后查看预订记录',
                go_to_login: '前往登录',
                no_bookings_found: '暂无预订记录',
                order_id: '订单号',
                room_type: '房型',
                checkin_date: '入住日期',
                checkout_date: '退房日期',
                total_amount: '总金额',
                booking_time: '预订时间',
                status_confirmed: '已确认',
                status_pending: '待确认',
                status_checked_in: '已入住',
                status_checked_out: '已退房',
                status_cancelled: '已取消',
                your_review: '您的评价',
                hotel_reply: '🏨 管理员回复',
                review_this_stay: '评价此次入住',
                share_experience_placeholder: '分享您的入住体验（至少5个字）...',
                submit_review: '提交评价',
                review_after_checkout: '退房后可进行评价',
                cancel_booking: '取消预订',
                confirm_cancel: '确认取消此预订？取消后无法恢复。',
                cancel_success: '预订已取消',
                cancel_fail: '取消失败，请重试',
                select_rating_alert: '请选择星级评分',
                comment_min_length_alert: '评价内容至少5个字',
                review_submit_success: '评价提交成功！',
                review_submit_fail: '提交失败'
            },
            en: {
                back_to_home: 'Back',
                my_bookings_title: 'My Bookings',
                login_required: 'Please login to view your bookings',
                go_to_login: 'Go to Login',
                no_bookings_found: 'No bookings found',
                order_id: 'Order ID',
                room_type: 'Room Type',
                checkin_date: 'Check-in',
                checkout_date: 'Check-out',
                total_amount: 'Total Amount',
                booking_time: 'Booking Time',
                status_confirmed: 'Confirmed',
                status_pending: 'Pending',
                status_checked_in: 'Checked-in',
                status_checked_out: 'Checked-out',
                status_cancelled: 'Cancelled',
                your_review: 'Your Review',
                hotel_reply: '🏨 Hotel Reply',
                review_this_stay: 'Review this stay',
                share_experience_placeholder: 'Share your experience (min 5 characters)...',
                submit_review: 'Submit Review',
                review_after_checkout: 'Review available after check-out',
                cancel_booking: 'Cancel Booking',
                confirm_cancel: 'Are you sure you want to cancel this booking? This cannot be undone.',
                cancel_success: 'Booking cancelled successfully',
                cancel_fail: 'Failed to cancel booking, please try again',
                select_rating_alert: 'Please select a rating',
                comment_min_length_alert: 'Comment must be at least 5 characters',
                review_submit_success: 'Review submitted successfully!',
                review_submit_fail: 'Failed to submit review'
            },
            fr: {
                back_to_home: 'Retour',
                my_bookings_title: 'Mes Réservations',
                login_required: 'Veuillez vous connecter pour voir vos réservations',
                go_to_login: 'Aller à la connexion',
                no_bookings_found: 'Aucune réservation trouvée',
                order_id: 'ID Commande',
                room_type: 'Type de chambre',
                checkin_date: 'Arrivée',
                checkout_date: 'Départ',
                total_amount: 'Montant Total',
                booking_time: 'Date de réservation',
                status_confirmed: 'Confirmé',
                status_pending: 'En attente',
                status_checked_in: 'Arrivé',
                status_checked_out: 'Parti',
                status_cancelled: 'Annulé',
                your_review: 'Votre Avis',
                hotel_reply: '🏨 Réponse de l\'hôtel',
                review_this_stay: 'Évaluer ce séjour',
                share_experience_placeholder: 'Partagez votre expérience (min 5 caractères)...',
                submit_review: 'Envoyer l\'avis',
                review_after_checkout: 'Avis disponible après le départ',
                cancel_booking: 'Annuler la réservation',
                confirm_cancel: 'Êtes-vous sûr de vouloir annuler ? Cette action est irréversible.',
                cancel_success: 'Réservation annulée avec succès',
                cancel_fail: 'Échec de l\'annulation',
                select_rating_alert: 'Veuillez choisir une note',
                comment_min_length_alert: 'Le commentaire doit faire au moins 5 caractères',
                review_submit_success: 'Avis envoyé avec succès !',
                review_submit_fail: 'Échec de l\'envoi'
            },
            ja: {
                back_to_home: '戻る',
                my_bookings_title: 'マイ予約',
                login_required: '予約を確認するにはログインしてください',
                go_to_login: 'ログインへ',
                no_bookings_found: '予約履歴がありません',
                order_id: '注文番号',
                room_type: '部屋タイプ',
                checkin_date: 'チェックイン',
                checkout_date: 'チェックアウト',
                total_amount: '合計金額',
                booking_time: '予約日時',
                status_confirmed: '確認済み',
                status_pending: '確認待ち',
                status_checked_in: 'チェックイン済み',
                status_checked_out: 'チェックアウト済み',
                status_cancelled: 'キャンセル済み',
                your_review: 'あなたの評価',
                hotel_reply: '🏨 ホテルからの返信',
                review_this_stay: 'この宿泊を評価する',
                share_experience_placeholder: '体験を共有してください（5文字以上）...',
                submit_review: '評価を送信',
                review_after_checkout: 'チェックアウト後に評価可能です',
                cancel_booking: '予約をキャンセル',
                confirm_cancel: 'この予約をキャンセルしてもよろしいですか？取り消しはできません。',
                cancel_success: '予約をキャンセルしました',
                cancel_fail: 'キャンセルの送信に失敗しました',
                select_rating_alert: '星評価を選択してください',
                comment_min_length_alert: 'コメントは5文字以上で入力してください',
                review_submit_success: '評価を送信しました！',
                review_submit_fail: '送信に失敗しました'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'zh';

        function applyI18n() {
            const dict = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });
            document.querySelectorAll('textarea[placeholder]').forEach(el => {
                // If it's the review textarea, update its placeholder
                if (el.id.startsWith('comment-')) {
                    el.placeholder = dict.share_experience_placeholder;
                }
            });
        }

        const STATUS_LABEL = {
            confirmed:     'status_confirmed',
            pending:       'status_pending',
            'checked-in':  'status_checked_in',
            'checked-out': 'status_checked_out',
            cancelled:     'status_cancelled'
        };

        function starsHtml(n) {
            return '<i class="fas fa-star"></i>'.repeat(n) + '<i class="far fa-star"></i>'.repeat(5 - n);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const langSelect = document.getElementById('langSelect');
            if (langSelect) {
                langSelect.value = currentLang;
                langSelect.addEventListener('change', (e) => {
                    currentLang = e.target.value;
                    localStorage.setItem('lang', currentLang);
                    applyI18n();
                    loadPage();
                });
            }
            applyI18n();

            if (!username) {
                const dict = i18n[currentLang];
                document.getElementById('bookingsList').innerHTML = `
                    <div class="empty">
                        <i class="fas fa-user-lock"></i>
                        <p>${dict.login_required}</p>
                        <a href="../login/login.html" style="color:#c8873a;">${dict.go_to_login}</a>
                    </div>`;
            } else {
                loadPage();
            }
        });

        async function loadPage() {
            const dict = i18n[currentLang];
            const [bookRes, revRes] = await Promise.all([
                fetch(`${API}/api/bookings`),
                fetch(`${API}/api/reviews`)
            ]);
            const bookData = await bookRes.json();
            const revData  = await revRes.json();

            const myList  = (bookData.bookings || []).filter(b => b.username === username).reverse();
            const reviews = revData.reviews || [];

            const container = document.getElementById('bookingsList');
            if (!myList.length) {
                container.innerHTML = `<div class="empty"><i class="fas fa-calendar-times"></i><p>${dict.no_bookings_found}</p></div>`;
                return;
            }

            container.innerHTML = myList.map(b => {
                const statusClass = 'status-' + (b.status || 'confirmed').replace(/\s/g, '-');
                const statusText  = dict[STATUS_LABEL[b.status]] || b.status;
                const isCheckedOut = b.status === 'checked-out';
                const isCancellable = b.status === 'confirmed' || b.status === 'pending';

                // 查找该预订是否已有评价（按 bookingId 或 roomId+username）
                const existingReview = reviews.find(r =>
                    r.bookingId === b.id || (r.roomId === b.roomId && r.username === username)
                );

                let reviewHtml = '';
                if (isCheckedOut) {
                    if (existingReview) {
                        reviewHtml = `
                            <div class="review-section">
                                <h4><i class="fas fa-star" style="color:#f59e0b"></i> ${dict.your_review}</h4>
                                <div class="existing-review">
                                    <div class="stars">${starsHtml(existingReview.rating)} ${existingReview.rating}.0</div>
                                    <div class="comment">${existingReview.comment}</div>
                                    ${existingReview.reply ? `
                                    <div style="margin-top:10px;background:#f0f7ff;border-left:3px solid #c8873a;padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:#555;">
                                        <div style="font-size:12px;color:#c8873a;font-weight:600;margin-bottom:4px;">${dict.hotel_reply}</div>
                                        <div>${existingReview.reply}</div>
                                    </div>` : ''}
                                </div>
                            </div>`;
                    } else {
                        reviewHtml = `
                            <div class="review-section">
                                <h4><i class="fas fa-star" style="color:#f59e0b"></i> ${dict.review_this_stay}</h4>
                                <div class="review-form" id="form-${b.id}">
                                    <div class="star-picker" id="stars-${b.id}">
                                        ${[1,2,3,4,5].map(n =>
                                            `<i class="far fa-star" data-val="${n}"
                                                onmouseover="hoverStar('${b.id}',${n})"
                                                onmouseout="resetStar('${b.id}')"
                                                onclick="pickStar('${b.id}',${n})"></i>`
                                        ).join('')}
                                    </div>
                                    <input type="hidden" id="rating-${b.id}" value="0">
                                    <textarea id="comment-${b.id}" rows="3" placeholder="${dict.share_experience_placeholder}"></textarea>
                                    <button class="submit-review-btn" onclick="submitReview('${b.id}','${b.roomId}','${(b.roomName && b.roomName[currentLang]) || (b.roomType && b.roomType[currentLang]) || ''}')">
                                        ${dict.submit_review}
                                    </button>
                                </div>
                            </div>`;
                    }
                } else if (b.status !== 'cancelled') {
                    reviewHtml = `<div class="review-section"><p class="review-hint"><i class="fas fa-info-circle"></i> ${dict.review_after_checkout}</p></div>`;
                }

                return `
                    <div class="booking-card">
                        <div class="booking-card-header">
                            <span class="booking-id">${dict.order_id}：${b.id}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        <div class="booking-info">
                            <div class="info-item"><label>${dict.room_type}</label><span>${(b.roomName && b.roomName[currentLang]) || (b.roomType && b.roomType[currentLang]) || '-'}</span></div>
                            <div class="info-item"><label>${dict.checkin_date}</label><span>${b.checkIn}</span></div>
                            <div class="info-item"><label>${dict.checkout_date}</label><span>${b.checkOut}</span></div>
                            <div class="info-item"><label>${dict.total_amount}</label><span>${b.totalDisplay || ('¥' + b.totalAmount)}</span></div>
                            <div class="info-item"><label>${dict.booking_time}</label><span>${new Date(b.createdAt).toLocaleDateString(currentLang === 'zh' ? 'zh-CN' : 'en-US')}</span></div>
                        </div>
                        ${reviewHtml}
                        ${isCancellable ? `
                        <div style="margin-top:16px;padding-top:16px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;">
                            <button class="cancel-btn"
                                data-roomtype="${(b.roomName && b.roomName[currentLang]) || (b.roomType && b.roomType[currentLang]) || '-'}"
                                data-checkin="${b.checkIn}"
                                data-checkout="${b.checkOut}"
                                onclick="cancelBooking(this, '${b.id}')">
                                <i class="fas fa-times-circle"></i> ${dict.cancel_booking}
                            </button>
                        </div>` : ''}
                    </div>`;
            }).join('');
        }

        function hoverStar(bookingId, n) {
            document.querySelectorAll(`#stars-${bookingId} i`).forEach((el, i) => {
                el.className = i < n ? 'fas fa-star' : 'far fa-star';
            });
        }
        function resetStar(bookingId) {
            const picked = parseInt(document.getElementById('rating-' + bookingId).value || 0);
            document.querySelectorAll(`#stars-${bookingId} i`).forEach((el, i) => {
                el.className = i < picked ? 'fas fa-star' : 'far fa-star';
            });
        }
        function pickStar(bookingId, n) {
            document.getElementById('rating-' + bookingId).value = n;
            resetStar(bookingId);
        }

        async function submitReview(bookingId, roomId, roomName) {
            const dict    = i18n[currentLang];
            const rating  = parseInt(document.getElementById('rating-'  + bookingId).value);
            const comment = (document.getElementById('comment-' + bookingId).value || '').trim();

            if (!rating)            { alert(dict.select_rating_alert); return; }
            if (comment.length < 5) { alert(dict.comment_min_length_alert); return; }

            const res  = await fetch(`${API}/api/reviews`, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ username, bookingId, roomId, roomName, rating, comment })
            });
            const data = await res.json();
            if (res.ok) {
                alert(dict.review_submit_success);
                loadPage();
            } else {
                alert(data.message || dict.review_submit_fail);
            }
        }

        async function cancelBooking(btn, bookingId) {
            const dict = i18n[currentLang];
            if (!confirm(dict.confirm_cancel)) return;
            const bookingData = {
                roomType: btn.dataset.roomtype || '',
                checkIn:  btn.dataset.checkin  || '',
                checkOut: btn.dataset.checkout || ''
            };
            const res  = await fetch(`${API}/api/bookings/${bookingId}/status`, {
                method:  'PUT',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ status: 'cancelled' })
            });
            const data = await res.json();
            if (res.ok) {
                if (window.notificationSystem) {
                    window.notificationSystem.notifyBookingCancelled(
                        JSON.parse(sessionStorage.getItem('user') || '{}').username,
                        bookingData
                    );
                }
                alert(dict.cancel_success);
                loadPage();
            } else {
                alert(data.message || dict.cancel_fail);
            }
        }
    </script>
    <script src="../notifications/notificationSystem.js"></script>
    <script src="../notifications/autoInject.js"></script>
</body>
</html>
