<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 · 91酒店</title>
    <!-- Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 样式文件 -->
    <link rel="stylesheet" href="../BookOut/Book.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- 导航栏（与 Book.html 完全一致） -->
    <header class="header">
        <div class="header-content">
            <a class="logo" href="../homePage/index.html" aria-label="首页">
                <div class="logo-main">91酒店</div>
                <div class="logo-sub">HONG KONG</div>
            </a>

            <div class="header-right">
                <nav class="header-links">
                    <a href="../BookOut/myBookings.html" class="header-link">我的订单</a>

                    <div class="currency-menu-container">
                        <a href="#" class="header-link" id="currencyBtn">
                            <span>港币</span> <i class="fas fa-chevron-down"></i>
                        </a>
                        <div class="currency-dropdown" id="currencyDropdown" style="display:none;">
                            <div class="currency-header">
                                <h3>货币</h3>
                                <button class="close-dropdown" id="closeCurrencyBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="currency-body">
                                <div class="currency-group">
                                    <h4>热门货币</h4>
                                    <ul class="currency-list">
                                        <li><a href="#" class="currency-item active" data-currency="HKD">港币</a></li>
                                        <li><a href="#" class="currency-item" data-currency="CNY">人民币 (CNY)</a></li>
                                        <li><a href="#" class="currency-item" data-currency="USD">美元</a></li>
                                        <li><a href="#" class="currency-item" data-currency="EUR">欧元</a></li>
                                        <li><a href="#" class="currency-item" data-currency="GBP">英镑</a></li>
                                        <li><a href="#" class="currency-item" data-currency="SGD">新加坡元 (SGD)</a></li>
                                        <li><a href="#" class="currency-item" data-currency="AUD">澳币</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="lang-menu-container">
                        <a href="#" class="header-link" id="langBtn">
                            <span>简体中文</span> <i class="fas fa-chevron-down"></i>
                        </a>
                        <div class="lang-dropdown" id="langDropdown" style="display:none;">
                            <div class="lang-header">
                                <h3>语言</h3>
                                <button class="close-dropdown" id="closeLangBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="lang-body">
                                <ul class="lang-list">
                                    <li><a href="#" class="lang-item active" data-lang="zh">简体中文</a></li>
                                    <li><a href="#" class="lang-item" data-lang="en">English</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div id="themeToggleMount"></div>

                    <div class="user-menu-container">
                        <button class="icon-btn" id="userBtn" aria-label="User profile">
                            <i class="far fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="userDropdown" style="display:none;">
                            <div id="loginFormContainer">
                                <div class="dropdown-header">
                                    <h3>帐号登入</h3>
                                    <button class="close-dropdown" id="closeLoginBtn"><i class="fas fa-times"></i></button>
                                </div>
                                <div class="dropdown-body">
                                    <div class="form-group">
                                        <input type="text" id="dropdownUsername" placeholder="使用者名称">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" id="dropdownPassword" placeholder="密码">
                                    </div>
                                    <button class="btn btn-secondary full-width" id="dropdownLoginBtn">登入</button>
                                    <div class="dropdown-footer">
                                        <a href="../register/register.html" class="create-account-link">建立一个帐户</a>
                                    </div>
                                </div>
                            </div>
                            <div id="loggedInContainer" style="display:none;">
                                <a href="../profile/profile.html" class="dropdown-item">更新个人资料</a>
                                <a href="#" class="dropdown-item" id="logoutBtn">登出</a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <h1 class="profile-title">您的个人资料</h1>
        
        <form id="profileForm">
            <!-- 头像区域 -->
            <div class="form-section avatar-section">
                <div class="avatar-wrapper">
                    <div class="avatar-preview" id="avatarPreview">
                        <img id="avatarImg" src="" alt="用户头像">
                        <i class="fas fa-user-circle default-avatar"></i>
                    </div>
                    <div class="avatar-actions">
                        <button type="button" class="btn btn-outline btn-sm" id="uploadAvatarBtn">
                            <i class="fas fa-camera"></i> 更换头像
                        </button>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        <p class="avatar-hint">支持 JPG、PNG 格式，大小不超过 2MB</p>
                    </div>
                </div>
            </div>

            <!-- 个人资料 -->
            <div class="form-section">
                <div class="section-header">
                    <h2>个人资料</h2>
                    <span class="required-note">*必需的</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名 (不可修改)</label>
                        <input type="text" id="username" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label>真实姓名 *</label>
                        <input type="text" id="fullName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>电子邮箱地址 *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>确认电子邮箱地址 *</label>
                        <input type="email" id="confirmEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>手机号码</label>
                        <input type="tel" id="phone" placeholder="选填">
                    </div>
                    <div class="form-group">
                        <label>角色</label>
                        <input type="text" id="roleDisplay" readonly disabled>
                    </div>
                </div>
                <!-- 管理员可见的额外字段 (权限控制演示) -->
                <div class="form-row admin-only" id="adminFields" style="display: none;">
                    <div class="form-group">
                        <label>注册时间</label>
                        <input type="text" id="registerDate" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label>账号状态</label>
                        <input type="text" id="accountStatus" readonly disabled>
                    </div>
                </div>
            </div>

            <!-- 密码修改 -->
            <div class="form-section">
                <h2>修改密码</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" placeholder="至少 8 个字符">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmPassword" placeholder="再次输入新密码">
                    </div>
                </div>
                <p class="password-hint">至少 8 个字符，区分大小写，可以包含 !@#%，不包含空格。</p>
            </div>

            <!-- 偏好设置 & 致谢 -->
            <div class="form-section highlight-section">
                <h2>偏好设置</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="marketing">
                    <label for="marketing">我希望透过邮寄、电子邮件、电话、简讯或其他即时通讯工具接收来自91酒店的促销、活动邀请和特别优惠。</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">*我确认我已年满18岁，并且我已阅读并同意适用的隐私权条款。<br><a href="#" class="policy-link">资料隐私和安全政策</a></label>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                <button type="submit" class="btn btn-primary" id="updateBtn">保存更新</button>
            </div>
        </form>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../notifications/notificationSystem.js"></script>
    <script src="profile.js"></script>
    <script src="../assets/js/theme-button.js"></script>
    <script>
    // ── 导航栏交互（与 Book.html 一致）──
    (function () {
        // 主题
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const themeMount = document.getElementById('themeToggleMount');
        if (themeMount) {
            const btn = document.createElement('theme-button');
            btn.setAttribute('value', savedTheme);
            btn.setAttribute('size', '0.8');
            btn.addEventListener('change', e => {
                document.documentElement.setAttribute('data-theme', e.detail);
                localStorage.setItem('theme', e.detail);
            });
            themeMount.appendChild(btn);
        }

        // 货币下拉
        const currencyBtn      = document.getElementById('currencyBtn');
        const currencyDropdown = document.getElementById('currencyDropdown');
        const closeCurrencyBtn = document.getElementById('closeCurrencyBtn');
        if (currencyBtn && currencyDropdown) {
            currencyBtn.addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                currencyDropdown.style.display = currencyDropdown.style.display === 'flex' ? 'none' : 'flex';
            });
            closeCurrencyBtn && closeCurrencyBtn.addEventListener('click', () => currencyDropdown.style.display = 'none');
            currencyDropdown.addEventListener('click', e => e.stopPropagation());
        }

        // 语言下拉
        const langBtn      = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const closeLangBtn = document.getElementById('closeLangBtn');
        if (langBtn && langDropdown) {
            langBtn.addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                langDropdown.style.display = langDropdown.style.display === 'flex' ? 'none' : 'flex';
            });
            closeLangBtn && closeLangBtn.addEventListener('click', () => langDropdown.style.display = 'none');
        }

        // 用户下拉
        const userBtn          = document.getElementById('userBtn');
        const userDropdown     = document.getElementById('userDropdown');
        const closeLoginBtn    = document.getElementById('closeLoginBtn');
        const loginFormCont    = document.getElementById('loginFormContainer');
        const loggedInCont     = document.getElementById('loggedInContainer');
        const logoutBtn        = document.getElementById('logoutBtn');
        const dropdownLoginBtn = document.getElementById('dropdownLoginBtn');

        function refreshUserState() {
            const u = sessionStorage.getItem('username');
            if (loginFormCont)  loginFormCont.style.display  = u ? 'none'  : 'block';
            if (loggedInCont)   loggedInCont.style.display   = u ? 'block' : 'none';
        }
        refreshUserState();

        if (userBtn && userDropdown) {
            userBtn.addEventListener('click', e => {
                e.stopPropagation();
                userDropdown.style.display = userDropdown.style.display === 'block' ? 'none' : 'block';
            });
            closeLoginBtn && closeLoginBtn.addEventListener('click', () => userDropdown.style.display = 'none');
            userDropdown.addEventListener('click', e => e.stopPropagation());
        }

        // 登入
        if (dropdownLoginBtn) {
            dropdownLoginBtn.addEventListener('click', async () => {
                const username = document.getElementById('dropdownUsername').value.trim();
                const password = document.getElementById('dropdownPassword').value;
                if (!username || !password) return;
                try {
                    const res  = await fetch('http://localhost:3000/api/login', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('username', data.username);
                        sessionStorage.setItem('role', data.role);
                        sessionStorage.setItem('name', data.name);
                        refreshUserState();
                        userDropdown.style.display = 'none';
                    } else { alert(data.message); }
                } catch { alert('无法连接服务器'); }
            });
        }

        // 登出
        if (logoutBtn) {
            logoutBtn.addEventListener('click', e => {
                e.preventDefault();
                sessionStorage.clear();
                window.location.href = '../homePage/index.html';
            });
        }

        // 点击外部关闭所有下拉
        document.addEventListener('click', () => {
            if (currencyDropdown) currencyDropdown.style.display = 'none';
            if (langDropdown)     langDropdown.style.display     = 'none';
            if (userDropdown)     userDropdown.style.display     = 'none';
        });
    })();
    </script>
</body>
</html>
