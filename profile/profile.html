<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 · 91酒店</title>
    <!-- Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 样式文件 -->
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- 导航栏（与 index.html 风格一致） -->
    <header class="pf-navbar" id="pfNavbar">
        <div class="pf-navbar-container">
            <div class="pf-navbar-left">
                <a href="../homePage/index.html" class="pf-nav-back">
                    <i class="fas fa-arrow-left"></i> 首页
                </a>
            </div>
            <div class="pf-navbar-center">
                <a class="pf-logo" href="../homePage/index.html" aria-label="首页">
                    <div class="pf-logo-main">91酒店</div>
                    <div class="pf-logo-sub">HONG KONG</div>
                </a>
            </div>
            <div class="pf-navbar-right">
                <a href="../BookOut/Book.html" class="pf-nav-link">客房预订</a>
                <span class="pf-nav-divider">|</span>
                <a href="../BookOut/myBookings.html" class="pf-nav-link">我的预订</a>
                <span class="pf-nav-divider">|</span>
                <button class="pf-nav-link pf-logout-btn" id="pfLogoutBtn">退出</button>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <h1 class="profile-title">您的个人资料</h1>
        
        <form id="profileForm">
            <!-- 头像区域 -->
            <div class="form-section avatar-section">
                <div class="avatar-wrapper">
                    <div class="avatar-preview" id="avatarPreview">
                        <img id="avatarImg" src="" alt="用户头像">
                        <i class="fas fa-user-circle default-avatar"></i>
                    </div>
                    <div class="avatar-actions">
                        <button type="button" class="btn btn-outline btn-sm" id="uploadAvatarBtn">
                            <i class="fas fa-camera"></i> 更换头像
                        </button>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        <p class="avatar-hint">支持 JPG、PNG 格式，大小不超过 2MB</p>
                    </div>
                </div>
            </div>

            <!-- 个人资料 -->
            <div class="form-section">
                <div class="section-header">
                    <h2>个人资料</h2>
                    <span class="required-note">*必需的</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>用户名 (不可修改)</label>
                        <input type="text" id="username" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label>真实姓名 *</label>
                        <input type="text" id="fullName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>电子邮箱地址 *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label>确认电子邮箱地址 *</label>
                        <input type="email" id="confirmEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>手机号码</label>
                        <input type="tel" id="phone" placeholder="选填">
                    </div>
                    <div class="form-group">
                        <label>角色</label>
                        <input type="text" id="roleDisplay" readonly disabled>
                    </div>
                </div>
                <!-- 管理员可见的额外字段 (权限控制演示) -->
                <div class="form-row admin-only" id="adminFields" style="display: none;">
                    <div class="form-group">
                        <label>注册时间</label>
                        <input type="text" id="registerDate" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label>账号状态</label>
                        <input type="text" id="accountStatus" readonly disabled>
                    </div>
                </div>
            </div>

            <!-- 密码修改 -->
            <div class="form-section">
                <h2>修改密码</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" placeholder="至少 8 个字符">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmPassword" placeholder="再次输入新密码">
                    </div>
                </div>
                <p class="password-hint">至少 8 个字符，区分大小写，可以包含 !@#%，不包含空格。</p>
            </div>

            <!-- 偏好设置 & 致谢 -->
            <div class="form-section highlight-section">
                <h2>偏好设置</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="marketing">
                    <label for="marketing">我希望透过邮寄、电子邮件、电话、简讯或其他即时通讯工具接收来自91酒店的促销、活动邀请和特别优惠。</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">*我确认我已年满18岁，并且我已阅读并同意适用的隐私权条款。<br><a href="#" class="policy-link">资料隐私和安全政策</a></label>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                <button type="submit" class="btn btn-primary" id="updateBtn">保存更新</button>
            </div>
        </form>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../notifications/notificationSystem.js"></script>
    <script src="profile.js"></script>
    <script>
        // 退出登录
        document.getElementById('pfLogoutBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = '../homePage/index.html';
        });
    </script>
</body>
</html>
