<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料 · 91酒店</title>
    <!-- Font Awesome 图标库 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- 样式文件 -->
    <link rel="stylesheet" href="../BookOut/Book.css">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- 导航栏（与 Book.html 完全一致） -->
    <header class="header">
        <div class="header-content">
            <a class="logo" href="../home/index.html" aria-label="首页">
                <div class="logo-main" data-i18n="hotel_name">91酒店</div>
                <div class="logo-sub">HONG KONG</div>
            </a>

            <div class="header-right">
                <nav class="header-links">
                    <a href="javascript:history.back()" class="header-link" data-i18n="back">
                        <i class="fas fa-arrow-left"></i> <span data-i18n="back">返回</span>
                    </a>

                    <div class="lang-menu-container">
                        <a href="#" class="header-link" id="langBtn">
                            <span>简体中文</span> <i class="fas fa-chevron-down"></i>
                        </a>
                        <div class="lang-dropdown" id="langDropdown" style="display:none;">
                            <div class="lang-header">
                                <h3>语言</h3>
                                <button class="close-dropdown" id="closeLangBtn"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="lang-body">
                                <ul class="lang-list">
                                    <li><a href="#" class="lang-item active" data-lang="zh">简体中文</a></li>
                                    <li><a href="#" class="lang-item" data-lang="en">English</a></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div id="themeToggleMount"></div>

                    <div class="user-menu-container">
                        <button class="icon-btn" id="userBtn" aria-label="User profile">
                            <i class="far fa-user"></i>
                        </button>
                        <div class="user-dropdown" id="userDropdown" style="display:none;">
                            <div id="loginFormContainer">
                                <div class="dropdown-header">
                                    <h3>帐号登入</h3>
                                    <button class="close-dropdown" id="closeLoginBtn"><i class="fas fa-times"></i></button>
                                </div>
                                <div class="dropdown-body">
                                    <div class="form-group">
                                        <input type="text" id="dropdownUsername" placeholder="使用者名称">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" id="dropdownPassword" placeholder="密码">
                                    </div>
                                    <button class="btn btn-secondary full-width" id="dropdownLoginBtn">登入</button>
                                    <div class="dropdown-footer">
                                        <a href="../register/register.html" class="create-account-link">建立一个帐户</a>
                                    </div>
                                </div>
                            </div>
                            <div id="loggedInContainer" style="display:none;">
                                <a href="../profile/profile.html" class="dropdown-item">更新个人资料</a>
                                <a href="#" class="dropdown-item" id="logoutBtn">登出</a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <div class="profile-container">
        <h1 class="profile-title" data-i18n="profile_title">您的个人资料</h1>
        
        <form id="profileForm">
            <!-- 个人资料 -->
            <div class="form-section">
                <div class="section-header">
                    <h2 data-i18n="section_profile">个人资料</h2>
                    <span class="required-note" data-i18n="required_note">*必需的</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="username">用户名 (不可修改)</label>
                        <input type="text" id="username" readonly disabled>
                    </div>
                    <div class="form-group">
                        <label data-i18n="full_name">真实姓名 *</label>
                        <input type="text" id="fullName" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="email">电子邮箱地址 *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="confirm_email">确认电子邮箱地址 *</label>
                        <input type="email" id="confirmEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="phone">联系电话</label>
                        <input type="tel" id="phone">
                    </div>
                </div>
            </div>

            <!-- 安全设置 -->
            <div class="form-section">
                <h2 data-i18n="password_section">安全设置</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="new_password">新密码</label>
                        <input type="password" id="newPassword" data-i18n-placeholder="password_hint">
                    </div>
                    <div class="form-group">
                        <label data-i18n="confirm_password">确认新密码</label>
                        <input type="password" id="confirmPassword" data-i18n-placeholder="password_hint">
                    </div>
                </div>
                <p class="password-hint" data-i18n="password_hint">至少 8 个字符，区分大小写，可以包含 !@#%，不包含空格。</p>
            </div>

            <!-- 偏好设置 & 致谢 -->
            <div class="form-section highlight-section">
                <h2 data-i18n="preferences">偏好设置</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="marketing">
                    <label for="marketing" data-i18n="marketing_label">我希望透过邮寄、电子邮件、电话、简讯或其他即时通讯工具接收来自91酒店的促销、活动邀请和特别优惠。</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms" data-i18n="terms_label">*我确认我已年满18岁，并且我已阅读并同意适用的隐私权条款。</label>
                    <a href="#" class="policy-link" data-i18n="policy_link">资料隐私和安全政策</a>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="form-actions">
                <button type="button" class="btn btn-outline" id="cancelBtn" data-i18n="cancel">取消</button>
                <button type="submit" class="btn btn-primary" id="updateBtn" data-i18n="save">保存更新</button>
            </div>
        </form>
    </div>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../notifications/notificationSystem.js"></script>
    <script src="profile.js"></script>
    <script src="../assets/js/theme-button.js"></script>
    <script>
    // ── 导航栏交互（与 Book.html 一致）──
    (function () {
        // 多语言支持
        const i18n = {
            zh: {
                hotel_name: '91酒店',
                page_title: '个人资料 · 91酒店',
                back: '返回',
                lang_title: '语言',
                lang_display: '简体中文',
                update_profile: '更新个人资料',
                logout: '登出',
                profile_title: '您的个人资料',
                change_avatar: '更换头像',
                avatar_hint: '支持 JPG、PNG 格式，大小不超过 2MB',
                section_profile: '个人资料',
                required_note: '*必需的',
                username: '用户名 (不可修改)',
                full_name: '真实姓名 *',
                email: '电子邮箱地址 *',
                confirm_email: '确认电子邮箱地址 *',
                phone: '联系电话',
                password_section: '安全设置',
                new_password: '新密码',
                confirm_password: '确认新密码',
                password_hint: '至少 8 个字符，区分大小写，可以包含 !@#%，不包含空格。',
                preferences: '偏好设置',
                marketing_label: '我希望透过邮寄、电子邮件、电话、简讯或其他即时通讯工具接收来自91酒店的促销、活动邀请和特别优惠。',
                terms_label: '*我确认我已年满18岁，并且我已阅读并同意适用的隐私权条款。',
                policy_link: '资料隐私和安全政策',
                cancel: '取消',
                save: '保存更新',
                account_login: '帐号登入',
                username_placeholder: '使用者名称',
                password_placeholder: '密码',
                login: '登入',
                create_account: '建立一个帐户'
            },
            en: {
                hotel_name: '91 Hotel',
                page_title: 'Profile · 91 Hotel',
                back: 'Back',
                lang_title: 'Language',
                lang_display: 'English',
                update_profile: 'Update Profile',
                logout: 'Logout',
                profile_title: 'Your Profile',
                change_avatar: 'Change Avatar',
                avatar_hint: 'Supports JPG, PNG formats, max 2MB',
                section_profile: 'Personal Profile',
                required_note: '*Required',
                username: 'Username (Read-only)',
                full_name: 'Full Name *',
                email: 'Email Address *',
                confirm_email: 'Confirm Email Address *',
                phone: 'Phone Number',
                password_section: 'Security Settings',
                new_password: 'New Password',
                confirm_password: 'Confirm New Password',
                password_hint: 'Min 8 characters, case sensitive, can include !@#%, no spaces.',
                preferences: 'Preferences',
                marketing_label: 'I would like to receive promotions, event invitations and special offers from 91 Hotel via mail, email, telephone, SMS or other instant messaging tools.',
                terms_label: '*I confirm that I am at least 18 years old and that I have read and agree to the applicable privacy terms.',
                policy_link: 'Data Privacy and Security Policy',
                cancel: 'Cancel',
                save: 'Save Changes',
                account_login: 'Account Login',
                username_placeholder: 'Username',
                password_placeholder: 'Password',
                login: 'Login',
                create_account: 'Create an Account'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'zh';

        function applyI18n(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
            
            const dict = i18n[lang] || i18n.zh;
            document.title = dict.page_title;
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.textContent = dict[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (dict[key]) el.setAttribute('placeholder', dict[key]);
            });

            // 更新语言显示文字
            const langDisplay = document.querySelector('#langBtn span');
            if (langDisplay) langDisplay.textContent = dict.lang_display;

            // 更新下拉列表的高亮状态
            document.querySelectorAll('.lang-item').forEach(item => {
                item.classList.toggle('active', item.getAttribute('data-lang') === lang);
            });
        }

        // 初始化语言
        applyI18n(currentLang);

        // 主题
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const themeMount = document.getElementById('themeToggleMount');
        if (themeMount) {
            const btn = document.createElement('theme-button');
            btn.setAttribute('value', savedTheme);
            btn.setAttribute('size', '0.8');
            btn.addEventListener('change', e => {
                document.documentElement.setAttribute('data-theme', e.detail);
                localStorage.setItem('theme', e.detail);
            });
            themeMount.appendChild(btn);
        }

        // 语言下拉
        const langBtn      = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');
        const closeLangBtn = document.getElementById('closeLangBtn');
        if (langBtn && langDropdown) {
            langBtn.addEventListener('click', e => {
                e.preventDefault(); e.stopPropagation();
                langDropdown.style.display = langDropdown.style.display === 'flex' ? 'none' : 'flex';
            });
            closeLangBtn && closeLangBtn.addEventListener('click', () => langDropdown.style.display = 'none');
            
            // 切换语言
            langDropdown.querySelectorAll('.lang-item').forEach(item => {
                item.addEventListener('click', e => {
                    e.preventDefault();
                    const lang = item.getAttribute('data-lang');
                    applyI18n(lang);
                    langDropdown.style.display = 'none';
                    // 广播语言切换事件
                    window.dispatchEvent(new CustomEvent('langChanged', { detail: { lang } }));
                });
            });
        }

        // 用户下拉
        const userBtn          = document.getElementById('userBtn');
        const userDropdown     = document.getElementById('userDropdown');
        const closeLoginBtn    = document.getElementById('closeLoginBtn');
        const loginFormCont    = document.getElementById('loginFormContainer');
        const loggedInCont     = document.getElementById('loggedInContainer');
        const logoutBtn        = document.getElementById('logoutBtn');
        const dropdownLoginBtn = document.getElementById('dropdownLoginBtn');

        function refreshUserState() {
            const u = sessionStorage.getItem('username');
            if (loginFormCont)  loginFormCont.style.display  = u ? 'none'  : 'block';
            if (loggedInCont)   loggedInCont.style.display   = u ? 'block' : 'none';
            
            // 更新用户下拉菜单中的翻译
            const dict = i18n[currentLang] || i18n.zh;
            if (loginFormCont) {
                loginFormCont.querySelector('h3').textContent = dict.account_login;
                loginFormCont.querySelector('#dropdownUsername').placeholder = dict.username_placeholder;
                loginFormCont.querySelector('#dropdownPassword').placeholder = dict.password_placeholder;
                loginFormCont.querySelector('#dropdownLoginBtn').textContent = dict.login;
                loginFormCont.querySelector('.create-account-link').textContent = dict.create_account;
            }
            if (loggedInCont) {
                loggedInCont.querySelector('a[href="../profile/profile.html"]').textContent = dict.update_profile;
                loggedInCont.querySelector('#logoutBtn').textContent = dict.logout;
            }
        }
        refreshUserState();

        if (userBtn && userDropdown) {
            userBtn.addEventListener('click', e => {
                e.stopPropagation();
                userDropdown.style.display = userDropdown.style.display === 'block' ? 'none' : 'block';
            });
            closeLoginBtn && closeLoginBtn.addEventListener('click', () => userDropdown.style.display = 'none');
            userDropdown.addEventListener('click', e => e.stopPropagation());
        }

        // 登入
        if (dropdownLoginBtn) {
            dropdownLoginBtn.addEventListener('click', async () => {
                const username = document.getElementById('dropdownUsername').value.trim();
                const password = document.getElementById('dropdownPassword').value;
                if (!username || !password) return;
                try {
                    const res  = await fetch('http://43.132.210.15:3000/api/login', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('username', data.username);
                        sessionStorage.setItem('role', data.role);
                        sessionStorage.setItem('name', data.name);
                        refreshUserState();
                        userDropdown.style.display = 'none';
                        window.location.reload(); // 登录后刷新页面以加载用户数据
                    } else { alert(data.message); }
                } catch { alert('无法连接服务器'); }
            });
        }

        // 登出
        if (logoutBtn) {
            logoutBtn.addEventListener('click', e => {
                e.preventDefault();
                sessionStorage.clear();
                window.location.href = '../home/index.html';
            });
        }

        // 点击外部关闭所有下拉
        document.addEventListener('click', () => {
            if (langDropdown)     langDropdown.style.display     = 'none';
            if (userDropdown)     userDropdown.style.display     = 'none';
        });
    })();
    </script>
</body>
</html>
