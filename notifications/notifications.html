<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息提醒 - XX酒店</title>
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="navbar">
        <div class="container navbar-container">
            <div class="navbar-left">
                <a class="logo" href="../Homepage/index.html" aria-label="返回首页">🏨 91 Hotel</a>
                <nav class="navbar-links" aria-label="站内导航">
                    <a href="../Homepage/index.html">首页</a>
                    <a href="../BookOut/Book.html">房型预订</a>
                    <a href="../profile/profile.html">个人中心</a>
                </nav>
            </div>
            <div class="navbar-right">
                <div class="navbar-actions">
                    <button class="nav-btn" onclick="history.back()">返回</button>
                </div>
                <div class="navbar-auth">
                    <span id="userGreeting"></span>
                    <button id="logoutBtn" class="nav-btn login-btn">退出</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="container">
            <!-- 页面标题 -->
            <div class="page-header">
                <h1 class="page-title">
                    <span class="title-icon">📬</span>
                    消息提醒
                </h1>
                <div class="page-actions">
                    <button id="markAllReadBtn" class="btn btn-secondary">全部标为已读</button>
                    <button id="clearAllBtn" class="btn btn-outline">清空消息</button>
                </div>
            </div>

            <!-- 消息统计 -->
            <div class="message-stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalCount">0</span>
                    <span class="stat-label">总消息</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number unread" id="unreadCount">0</span>
                    <span class="stat-label">未读</span>
                </div>
            </div>

            <!-- 消息筛选 -->
            <div class="message-filters">
                <button class="filter-btn active" data-filter="all">全部消息</button>
                <button class="filter-btn" data-filter="unread">未读消息</button>
                <button class="filter-btn" data-filter="login_success">登录通知</button>
                <button class="filter-btn" data-filter="booking_success">预订通知</button>
                <button class="filter-btn" data-filter="profile_update">信息更新</button>
            </div>

            <!-- 消息列表 -->
            <div class="messages-container">
                <div id="messagesList" class="messages-list">
                    <!-- 消息项将通过JavaScript动态生成 -->
                </div>
                
                <!-- 空状态 -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">📭</div>
                    <h3>暂无消息</h3>
                    <p>您还没有收到任何消息通知</p>
                </div>

                <!-- 加载状态 -->
                <div id="loadingState" class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>正在加载消息...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- 消息详情模态框 -->
    <div id="messageModal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">消息详情</h3>
                <button class="modal-close" id="modalCloseBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="message-detail">
                    <div class="message-meta">
                        <span class="message-type" id="modalType"></span>
                        <span class="message-time" id="modalTime"></span>
                    </div>
                    <div class="message-content" id="modalContent"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modalMarkReadBtn" class="btn btn-primary">标为已读</button>
                <button id="modalDeleteBtn" class="btn btn-outline">删除消息</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="confirmModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-small">
            <div class="modal-header">
                <h3 id="confirmTitle">确认操作</h3>
            </div>
            <div class="modal-body">
                <p id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button id="confirmCancelBtn" class="btn btn-outline">取消</button>
                <button id="confirmOkBtn" class="btn btn-primary">确定</button>
            </div>
        </div>
    </div>

    <!-- 引入通知系统 -->
    <script src="notificationSystem.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
